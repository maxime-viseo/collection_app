<header id="collection-header">
  <h1>My Collection</h1>
  <div>
    <app-search-bar 
    (searchButtonclicked)="incrementCount()"
    [search]="searchText"
    (searchChanged)="searchText = $event"
    ></app-search-bar>
    Clicked count: {{count}} <br>
    Search text: {{searchText}}
  </div>
</header>

<section class="collection-grid">
  <app-collection-item-card ></app-collection-item-card>
  <app-collection-item-card [collectionItem]="coin"></app-collection-item-card>
  <app-collection-item-card [collectionItem]="ronflex"></app-collection-item-card>
</section>
